<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Granulés">
<title>Granulés</title>
<style>
 body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:#f4f1ec;color:#222}
 h1{font-size:22px;margin:0 0 12px}
 h2{font-size:17px;margin:20px 0 8px}
 .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
 button{font-size:17px;padding:12px 16px;border:0;border-radius:10px;background:#c4561a;color:#fff;margin:4px 4px 4px 0}
 button.sec{background:#666}
 button.sup{background:#b00020;font-size:14px;padding:6px 10px;margin:0}
 input,select{font-size:17px;padding:8px;width:100%;box-sizing:border-box;margin:4px 0 8px}
 table{width:100%;border-collapse:collapse;font-size:14px}
 td,th{padding:4px;border-bottom:1px solid #eee;text-align:left}
 .big{font-size:28px;font-weight:bold}
 .small{color:#666;font-size:13px}
</style>
</head>
<body>
<h1>🔥 Suivi granulés</h1>

<div class="card">
 <div class="small">Saison en cours : <span id="saisonNom">aucune</span></div>
 <div class="big"><span id="stockSacs">0</span> sacs en stock</div>
 <div class="small" id="stockKg"></div>
 <div class="small" id="meteo"></div>
</div>

<div class="card">
 <h2>Rechargement</h2>
 <label>Quantité (kg)</label>
 <input id="recKg" type="number" step="0.1" value="0.9">
 <label>Consigne (°C)</label>
 <input id="recConsigne" type="number" step="0.5" value="19">
 <label>Température du salon (°C, facultatif)</label>
 <input id="recSalon" type="number" step="0.1">
 <button onclick="recharger()">Recharger maintenant</button>
</div>

<div class="card">
 <h2>Achat de sacs</h2>
 <label>Nombre de sacs</label>
 <input id="achNb" type="number" value="3">
 <label>Poids d'un sac (kg)</label>
 <input id="achPoids" type="number" value="15">
 <label>Prix d'un sac (€)</label>
 <input id="achPrix" type="number" step="0.01" value="6.50">
 <button onclick="acheter()">Enregistrer l'achat</button>
</div>

<div class="card">
 <h2>Achats enregistrés</h2>
 <table id="histoAchats"></table>
</div>

<div class="card">
 <h2>Saison</h2>
 <button onclick="demarrerSaison()">Démarrer une saison</button>
 <button class="sec" onclick="cloturerSaison()">Clôturer la saison</button>
</div>

<div class="card">
 <h2>Consommation et coût</h2>
 <select id="periode" onchange="afficherStats()">
  <option value="semaine">Par semaine</option>
  <option value="mois">Par mois</option>
  <option value="saison">Par saison</option>
 </select>
 <table id="stats"></table>
 <div class="small" id="prixMoyen"></div>
</div>

<div class="card">
 <h2>Derniers rechargements</h2>
 <table id="histo"></table>
</div>

<div class="card">
 <h2>Sauvegarde</h2>
 <button class="sec" onclick="exporter()">Exporter</button>
 <button class="sec" onclick="document.getElementById('fichier').click()">Importer</button>
 <input id="fichier" type="file" accept=".json" style="display:none" onchange="importer(event)">
</div>

<script>
const CLE='granules_v1';
let d=JSON.parse(localStorage.getItem(CLE)||'null')||{recharges:[],achats:[],saisons:[]};
let temperatureExt=null;
function sauver(){localStorage.setItem(CLE,JSON.stringify(d));afficher();}
function saisonActive(){return d.saisons.find(s=>!s.fin);}
function prixMoyen(){
 let kg=0,eur=0;
 d.achats.forEach(a=>{kg+=a.nb*a.poids;eur+=a.nb*a.prix;});
 return kg?eur/kg:0;
}
function recharger(){
 const kg=parseFloat(recKg.value);
 if(!kg)return;
 const s=saisonActive();
 d.recharges.push({t:new Date().toISOString(),kg:kg,consigne:parseFloat(recConsigne.value)||null,salon:parseFloat(recSalon.value)||null,ext:temperatureExt,prix:prixMoyen(),saison:s?s.nom:null});
 recSalon.value='';
 sauver();
}
function acheter(){
 const nb=parseFloat(achNb.value),poids=parseFloat(achPoids.value),prix=parseFloat(achPrix.value);
 if(!nb||!poids||!prix)return;
 d.achats.push({t:new Date().toISOString(),nb:nb,poids:poids,prix:prix});
 sauver();
}
function supprimerAchat(i){
 const a=d.achats[i];
 if(a&&confirm('Supprimer cet achat de '+a.nb+' sacs ?')){d.achats.splice(i,1);sauver();}
}
function supprimerRecharge(i){
 const r=d.recharges[i];
 if(r&&confirm('Supprimer ce rechargement de '+r.kg+' kg ?')){d.recharges.splice(i,1);sauver();}
}
function demarrerSaison(){
 if(saisonActive()){alert('Une saison est déjà en cours.');return;}
 const nom=prompt('Nom de la saison','Hiver '+new Date().getFullYear());
 if(nom){d.saisons.push({nom:nom,debut:new Date().toISOString(),fin:null});sauver();}
}
function cloturerSaison(){
 const s=saisonActive();
 if(!s){alert('Aucune saison en cours.');return;}
 if(confirm('Clôturer '+s.nom+' ?')){s.fin=new Date().toISOString();sauver();}
}
function cleSemaine(date){
 const x=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
 const jour=x.getUTCDay()||7;
 x.setUTCDate(x.getUTCDate()+4-jour);
 const debut=new Date(Date.UTC(x.getUTCFullYear(),0,1));
 const sem=Math.ceil(((x-debut)/86400000+1)/7);
 return x.getUTCFullYear()+' S'+String(sem).padStart(2,'0');
}
function afficherStats(){
 const mode=periode.value,groupes={};
 d.recharges.forEach(r=>{
  const dt=new Date(r.t);
  let cle;
  if(mode==='semaine')cle=cleSemaine(dt);
  else if(mode==='mois')cle=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
  else cle=r.saison||'Hors saison';
  groupes[cle]=groupes[cle]||{kg:0,eur:0};
  groupes[cle].kg+=r.kg;
  groupes[cle].eur+=r.kg*(r.prix||0);
 });
 let html='<tr><th>Période</th><th>kg</th><th>Coût</th></tr>';
 Object.keys(groupes).sort().reverse().forEach(c=>{
  html+='<tr><td>'+c+'</td><td>'+groupes[c].kg.toFixed(1)+'</td><td>'+groupes[c].eur.toFixed(2)+' €</td></tr>';
 });
 stats.innerHTML=html;
 prixMoyenEl.textContent='Prix moyen pondéré : '+prixMoyen().toFixed(3)+' €/kg';
}
const prixMoyenEl=document.getElementById('prixMoyen');
function afficher(){
 const s=saisonActive();
 saisonNom.textContent=s?s.nom:'aucune';
 const kgAchetes=d.achats.reduce((a,x)=>a+x.nb*x.poids,0);
 const kgUtilises=d.recharges.reduce((a,x)=>a+x.kg,0);
 const kgStock=Math.max(0,kgAchetes-kgUtilises);
 stockSacs.textContent=(kgStock/15).toFixed(1);
 stockKg.textContent=kgStock.toFixed(1)+' kg restants';
 let ha='<tr><th>Date</th><th>Sacs</th><th>Prix</th><th></th></tr>';
 d.achats.forEach((a,i)=>{
  ha+='<tr><td>'+new Date(a.t).toLocaleDateString('fr-FR')+'</td><td>'+a.nb+' x '+a.poids+' kg</td><td>'+a.prix.toFixed(2)+' €</td><td><button class="sup" onclick="supprimerAchat('+i+')">Suppr.</button></td></tr>';
 });
 histoAchats.innerHTML=ha;
 let h='<tr><th>Date</th><th>kg</th><th>Cons.</th><th>Ext.</th><th></th></tr>';
 const debut=Math.max(0,d.recharges.length-10);
 for(let i=d.recharges.length-1;i>=debut;i--){
  const r=d.recharges[i];
  const dt=new Date(r.t);
  h+='<tr><td>'+dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</td><td>'+r.kg+'</td><td>'+(r.consigne??'')+'</td><td>'+(r.ext!=null?r.ext+'°':'')+'</td><td><button class="sup" onclick="supprimerRecharge('+i+')">Suppr.</button></td></tr>';
 }
 histo.innerHTML=h;
 afficherStats();
}
function chargerMeteo(lat,lon){
 fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m')
 .then(r=>r.json()).then(j=>{
  temperatureExt=j.current.temperature_2m;
  meteo.textContent='Température extérieure : '+temperatureExt+' °C';
 }).catch(()=>{meteo.textContent='Météo indisponible';});
}
function initMeteo(){
 const secours=[48.85,2.35];
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
   p=>chargerMeteo(p.coords.latitude,p.coords.longitude),
   ()=>chargerMeteo(secours[0],secours[1]),
   {timeout:8000}
  );
 }else chargerMeteo(secours[0],secours[1]);
}
function exporter(){
 const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='granules-sauvegarde.json';
 a.click();
}
function importer(e){
 const f=e.target.files[0];
 if(!f)return;
 const lecteur=new FileReader();
 lecteur.onload=()=>{
  try{d=JSON.parse(lecteur.result);sauver();alert('Import réussi.');}
  catch(x){alert('Fichier invalide.');}
 };
 lecteur.readAsText(f);
}
afficher();
initMeteo();
</script>
</body>
</html>
