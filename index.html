<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Granulés">
<title>Granulés</title>
<style>
 body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:#f4f1ec;color:#222}
 h1{font-size:22px;margin:0 0 12px}
 h2{font-size:17px;margin:20px 0 8px}
 .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
 button{font-size:17px;padding:12px 16px;border:0;border-radius:10px;background:#c4561a;color:#fff;margin:4px 4px 4px 0}
 button.sec{background:#666}
 button.sup{background:#b00020;font-size:14px;padding:6px 10px;margin:0}
 input,select{font-size:17px;padding:8px;width:100%;box-sizing:border-box;margin:4px 0 8px}
 table{width:100%;border-collapse:collapse;font-size:14px}
 td,th{padding:4px;border-bottom:1px solid #eee;text-align:left}
 .big{font-size:28px;font-weight:bold}
 .small{color:#666;font-size:13px}
 .nav{display:flex;gap:6px;align-items:center}
 .nav input{flex:1;margin:4px 0}
 .nav button{margin:4px 0;padding:8px 14px}
 svg text{font-size:10px;fill:#666}
 #courbe{touch-action:pan-y}
</style>
</head>
<body>
<h1>🔥 Suivi granulés <span class="small">v6</span></h1>

<div class="card">
 <div class="small">Saison en cours : <span id="saisonNom">aucune</span></div>
 <div class="big"><span id="stockSacs">0</span> sacs en stock</div>
 <div class="small" id="stockKg"></div>
 <div class="small" id="meteo"></div>
</div>

<div class="card">
 <h2>Rechargement</h2>
 <label>Nombre de récipients</label>
 <input id="recNb" type="number" min="1" step="1" value="1" inputmode="numeric" oninput="majTotalRec()">
 <label>Poids d'un récipient (kg)</label>
 <input id="recKg" type="number" step="0.01" value="0.86" oninput="majTotalRec()">
 <div class="small" id="totalRec"></div>
 <label>Consigne (°C)</label>
 <input id="recConsigne" type="number" step="0.5" value="19">
 <label>Température du salon (°C, facultatif)</label>
 <input id="recSalon" type="number" step="0.1">
 <button onclick="recharger()">Recharger maintenant</button>
 <div id="confirmRec" style="font-weight:bold;color:#2a7;margin-top:6px"></div>
 <button class="sec" id="btnAnnuler" onclick="annulerDernier()" style="display:none;margin-top:8px"></button>
</div>

<div class="card">
 <h2>Achat de sacs</h2>
 <label>Nombre de sacs</label>
 <input id="achNb" type="number" value="3">
 <label>Poids d'un sac (kg)</label>
 <input id="achPoids" type="number" value="15">
 <label>Prix d'un sac (€)</label>
 <input id="achPrix" type="number" step="0.01" value="6.50">
 <button onclick="acheter()">Enregistrer l'achat</button>
</div>

<div class="card">
 <h2>Achats enregistrés</h2>
 <table id="histoAchats"></table>
</div>

<div class="card">
 <h2>Saison</h2>
 <button onclick="demarrerSaison()">Démarrer une saison</button>
 <button class="sec" onclick="cloturerSaison()">Clôturer la saison</button>
</div>

<div class="card">
 <h2>Horaires de marche</h2>
 <div class="nav">
  <button class="sec" onclick="changerJourH(-1)">◀</button>
  <input id="jourH" type="date" onchange="afficherHoraires()">
  <button class="sec" onclick="changerJourH(1)">▶</button>
 </div>
 <div class="small" id="libJourH"></div>
 <input id="plagesJour" type="text" placeholder="ex. 5h-7h, 16h30-21h">
 <div class="small" id="totalJourH"></div>
 <button onclick="enregistrerJourH()">Enregistrer ce jour</button>
 <button class="sec" onclick="eteintJourH()">Éteint toute la journée</button>
 <button class="sec" onclick="typeJourH()">Horaire type</button>
 <h2>Horaires types</h2>
 <label>Semaine (lundi à vendredi)</label>
 <input id="hSemaine" type="text">
 <label>Week-end (samedi et dimanche)</label>
 <input id="hWeekend" type="text">
 <label>Suivi des heures depuis le</label>
 <input id="hDepuis" type="date">
 <button class="sec" onclick="enregistrerTypes()">Enregistrer les horaires types</button>
</div>

<div class="card">
 <h2>Consommation et coût</h2>
 <select id="periode" onchange="afficherStats()">
  <option value="semaine">Par semaine</option>
  <option value="mois">Par mois</option>
  <option value="saison">Par saison</option>
 </select>
 <table id="stats"></table>
 <div class="small" id="prixMoyen"></div>
</div>

<div class="card">
 <h2>Derniers rechargements</h2>
 <table id="histo"></table>
</div>

<div class="card">
 <h2>Température du salon</h2>
 <div class="nav">
  <button class="sec" onclick="changerJour(-1)">◀</button>
  <input id="jour" type="date" onchange="afficherCourbe()">
  <button class="sec" onclick="changerJour(1)">▶</button>
 </div>
 <svg id="courbe" viewBox="0 0 340 200" width="100%"></svg>
 <div class="big" id="moyJour"></div>
 <div class="small" id="detailJour"></div>
 <div class="small" id="pointJour"></div>
 <button class="sec" onclick="document.getElementById('fichierTempro').click()">Importer un CSV Tempro</button>
 <input id="fichierTempro" type="file" accept=".csv,.txt,text/csv,text/plain,text/comma-separated-values" style="display:none" onchange="importerTempro(event)">
 <div class="small" id="infoTempro"></div>
</div>

<div class="card">
 <h2>Sauvegarde</h2>
 <button class="sec" onclick="exporter()">Exporter</button>
 <button class="sec" onclick="document.getElementById('fichier').click()">Importer</button>
 <input id="fichier" type="file" accept=".json" style="display:none" onchange="importer(event)">
</div>

<script>
const CLE='granules_v1';
function p2(n){return String(n).padStart(2,'0');}
let d=JSON.parse(localStorage.getItem(CLE)||'null')||{recharges:[],achats:[],saisons:[]};
function num(v){v=parseFloat(String(v??'').replace(',','.'));return isFinite(v)?v:null;}
function dateIso(t){return typeof t==='number'?new Date(t).toISOString():t;}
// Remet au bon format les données enregistrées par les anciennes versions (sinon NaN dans le stock)
function normaliser(){
 if(!d||typeof d!=='object')d={};
 d.recharges=Array.isArray(d.recharges)?d.recharges:[];
 d.achats=Array.isArray(d.achats)?d.achats:[];
 d.saisons=Array.isArray(d.saisons)?d.saisons:[];
 const poidsDefaut=num(d.reglages&&d.reglages.kgSac)||15;
 if(d.saisonEnCours){d.saisons.push(Object.assign({},d.saisonEnCours,{fin:null}));delete d.saisonEnCours;}
 d.saisons.forEach(s=>{s.debut=dateIso(s.debut);s.fin=s.fin?dateIso(s.fin):null;});
 d.achats.forEach(a=>{
  a.t=dateIso(a.t);
  a.nb=num(a.nb??a.sacs)??0;
  a.poids=num(a.poids)??poidsDefaut;
  a.prix=num(a.prix??a.prixSac)??0;
  delete a.sacs;delete a.prixSac;
 });
 d.recharges.forEach(r=>{
  r.t=dateIso(r.t);
  r.kg=num(r.kg)??0;
  if(r.prix==null&&num(r.cout)!=null&&r.kg)r.prix=num(r.cout)/r.kg;
  if(r.ext==null&&r.tExt!=null)r.ext=r.tExt;
  if(typeof r.saison==='number'){const s=d.saisons.find(x=>x.id===r.saison);r.saison=s?s.nom:null;}
 });
 if(Array.isArray(d.salon)){
  const o={};
  d.salon.forEach(m=>{const t=new Date(m.t),v=num(m.v);if(!isNaN(t)&&v!=null)o[t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())+' '+p2(t.getHours())+':'+p2(t.getMinutes())]=[v,null];});
  d.salon=o;
 }
 if(!d.salon||typeof d.salon!=='object')d.salon={};
 // Horaires de marche du poêle (minutes depuis minuit)
 const hd=(d.horaires&&typeof d.horaires==='object')?d.horaires:{};
 const ok=(p,def)=>Array.isArray(p)&&p.every(x=>Array.isArray(x)&&x.length===2&&isFinite(x[0])&&isFinite(x[1]))?p:def;
 const jours={};
 if(hd.jours&&typeof hd.jours==='object')Object.keys(hd.jours).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k)){const p=ok(hd.jours[k],null);if(p)jours[k]=p;}});
 d.horaires={
  depuis:/^\d{4}-\d{2}-\d{2}$/.test(hd.depuis||'')?hd.depuis:'2026-11-26',
  semaine:ok(hd.semaine,[[300,420],[990,1260]]),
  weekend:ok(hd.weekend,[[420,720],[1020,1260]]),
  jours:jours
 };
}
normaliser();
localStorage.setItem(CLE,JSON.stringify(d));
let temperatureExt=null;
function sauver(){localStorage.setItem(CLE,JSON.stringify(d));afficher();}
function saisonActive(){return d.saisons.find(s=>!s.fin);}
function prixMoyen(){
 let kg=0,eur=0;
 d.achats.forEach(a=>{kg+=a.nb*a.poids;eur+=a.nb*a.prix;});
 return kg?eur/kg:0;
}
function dernierLibelle(r){
 const dt=new Date(r.t);
 return dt.toLocaleDateString('fr-FR')+' '+p2(dt.getHours())+':'+p2(dt.getMinutes())+', '+String(r.kg).replace('.',',')+' kg';
}
function majAnnuler(){
 const b=document.getElementById('btnAnnuler');
 const r=d.recharges[d.recharges.length-1];
 if(!r){b.style.display='none';return;}
 b.style.display='';
 b.textContent='↩ Annuler le dernier rechargement ('+dernierLibelle(r)+')';
}
function annulerDernier(){
 const r=d.recharges[d.recharges.length-1];
 if(!r)return;
 if(confirm('Annuler le rechargement du '+dernierLibelle(r)+' ?\nLes '+String(r.kg).replace('.',',')+' kg seront remis dans le stock.')){
  d.recharges.pop();
  sauver();
  confirmRec.textContent='↩ Rechargement annulé ('+dernierLibelle(r)+')';
 }
}
function majTotalRec(){
 const nb=Math.round(num(recNb.value)||0),poids=num(recKg.value)||0;
 document.getElementById('totalRec').textContent=nb>0&&poids>0?'Total : '+(nb*poids).toFixed(2).replace('.',',')+' kg':'';
}
function recharger(){
 try{
  const nb=Math.round(num(recNb.value)||0),poids=num(recKg.value);
  if(!nb||nb<1){alert('Indique le nombre de récipients (1 ou plus).');return;}
  if(!poids||poids<=0){alert('Poids invalide : indique le poids d\'un récipient en kg (ex. 0,86).');return;}
  const kg=Math.round(nb*poids*1000)/1000;
  const s=saisonActive();
  d.recharges.push({t:new Date().toISOString(),kg:kg,consigne:num(recConsigne.value),salon:num(recSalon.value),ext:temperatureExt,prix:prixMoyen(),saison:s?s.nom:null});
  recSalon.value='';recNb.value=1;majTotalRec();
  sauver();
  const kgAch=d.achats.reduce((a,x)=>a+x.nb*x.poids,0),kgUt=d.recharges.reduce((a,x)=>a+x.kg,0);
  const h=new Date();
  confirmRec.textContent='✓ '+nb+' récipient'+(nb>1?'s':'')+' = '+String(kg).replace('.',',')+' kg enregistré à '+p2(h.getHours())+':'+p2(h.getMinutes())+' · reste '+Math.max(0,kgAch-kgUt).toFixed(1).replace('.',',')+' kg';
 }catch(e){alert('Erreur au rechargement : '+e.message);}
}
function acheter(){
 const nb=parseFloat(achNb.value),poids=parseFloat(achPoids.value),prix=parseFloat(achPrix.value);
 if(!nb||!poids||!prix)return;
 d.achats.push({t:new Date().toISOString(),nb:nb,poids:poids,prix:prix});
 sauver();
}
function supprimerAchat(i){
 const a=d.achats[i];
 if(a&&confirm('Supprimer cet achat de '+a.nb+' sacs ?')){d.achats.splice(i,1);sauver();}
}
function supprimerRecharge(i){
 const r=d.recharges[i];
 if(r&&confirm('Supprimer ce rechargement de '+r.kg+' kg ?')){d.recharges.splice(i,1);sauver();confirmRec.textContent='';}
}
function demarrerSaison(){
 if(saisonActive()){alert('Une saison est déjà en cours.');return;}
 const nom=prompt('Nom de la saison','Hiver '+new Date().getFullYear());
 if(nom){d.saisons.push({nom:nom,debut:new Date().toISOString(),fin:null});sauver();}
}
function cloturerSaison(){
 const s=saisonActive();
 if(!s){alert('Aucune saison en cours.');return;}
 if(confirm('Clôturer '+s.nom+' ?')){s.fin=new Date().toISOString();sauver();}
}
function cleSemaine(date){
 const x=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
 const jour=x.getUTCDay()||7;
 x.setUTCDate(x.getUTCDate()+4-jour);
 const debut=new Date(Date.UTC(x.getUTCFullYear(),0,1));
 const sem=Math.ceil(((x-debut)/86400000+1)/7);
 return x.getUTCFullYear()+' S'+String(sem).padStart(2,'0');
}
/* ---- Horaires de marche ---- */
function cleJour(dt){return dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());}
function dateDeCle(k){const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function fmtH(m){const h=Math.floor(m/60),mm=m%60;return h+'h'+(mm?p2(mm):'');}
function fmtPlages(p){return p.map(x=>fmtH(x[0])+'-'+fmtH(x[1])).join(', ');}
function parseHeure(s){
 const m=/^(\d{1,2})\s*(?:[h:]\s*(\d{1,2})?)?$/i.exec(s.trim());
 if(!m)return null;
 const h=+m[1],mi=m[2]!==undefined?+m[2]:0;
 if(h>24||mi>59||(h===24&&mi>0))return null;
 return h*60+mi;
}
function parsePlages(txt){
 txt=String(txt||'').trim();
 if(!txt)return [];
 const out=[];
 for(const part of txt.split(/[,;]|\bet\b/i)){
  if(!part.trim())continue;
  const ab=part.split(/\s*(?:-|–|à)\s*/);
  if(ab.length!==2)return null;
  const a=parseHeure(ab[0]),b=parseHeure(ab[1]);
  if(a==null||b==null||b<=a)return null;
  out.push([a,b]);
 }
 return out.sort((x,y)=>x[0]-y[0]);
}
function typePour(cle){const w=dateDeCle(cle).getDay();return (w===0||w===6)?d.horaires.weekend:d.horaires.semaine;}
function plagesDuJour(cle){
 const H=d.horaires;
 if(H.jours[cle])return H.jours[cle];
 if(cle<H.depuis)return null;
 return typePour(cle);
}
function minutesJour(cle){
 const p=plagesDuJour(cle);
 if(!p)return 0;
 const now=new Date();
 const cap=cle===cleJour(now)?now.getHours()*60+now.getMinutes():1440;
 return p.reduce((a,x)=>a+Math.max(0,Math.min(x[1],cap)-x[0]),0);
}
function changerJourH(delta){
 const dt=dateDeCle(jourH.value||cleJour(new Date()));
 dt.setDate(dt.getDate()+delta);
 jourH.value=cleJour(dt);
 afficherHoraires();
}
function afficherHoraires(){
 const H=d.horaires;
 if(!jourH.value)jourH.value=cleJour(new Date());
 hSemaine.value=fmtPlages(H.semaine);
 hWeekend.value=fmtPlages(H.weekend);
 hDepuis.value=H.depuis;
 const k=jourH.value,p=plagesDuJour(k);
 const w=dateDeCle(k).getDay(),typeNom=(w===0||w===6)?'week-end':'semaine';
 if(!p){
  plagesJour.value='';
  libJourH.textContent='Avant le début du suivi ('+H.depuis+')';
  totalJourH.textContent='';
  return;
 }
 plagesJour.value=fmtPlages(p);
 libJourH.textContent=H.jours[k]?'Horaires modifiés pour ce jour':'Horaire type ('+typeNom+')';
 const mn=p.reduce((a,x)=>a+(x[1]-x[0]),0);
 totalJourH.textContent=p.length?'Marche : '+Math.floor(mn/60)+' h'+(mn%60?' '+p2(mn%60):''):'Poêle éteint toute la journée';
}
function enregistrerJourH(){
 const p=parsePlages(plagesJour.value);
 if(p===null){alert('Format non reconnu. Exemple : 5h-7h, 16h30-21h');return;}
 d.horaires.jours[jourH.value]=p;
 sauver();
}
function eteintJourH(){d.horaires.jours[jourH.value]=[];sauver();}
function typeJourH(){delete d.horaires.jours[jourH.value];sauver();}
function enregistrerTypes(){
 const s=parsePlages(hSemaine.value),w=parsePlages(hWeekend.value);
 if(s===null||w===null){alert('Format non reconnu. Exemple : 5h-7h, 16h30-21h');return;}
 if(!hDepuis.value){alert('Indique la date de début du suivi.');return;}
 // Fige les jours déjà passés avec les anciens horaires types, pour ne pas les modifier
 const H=d.horaires,hier=new Date();
 hier.setDate(hier.getDate()-1);
 const finGel=cleJour(hier);
 for(let dt=dateDeCle(H.depuis),n=0;cleJour(dt)<=finGel&&n<3700;dt.setDate(dt.getDate()+1),n++){
  const k=cleJour(dt);
  if(!H.jours[k])H.jours[k]=typePour(k).map(x=>x.slice());
 }
 H.semaine=s;H.weekend=w;H.depuis=hDepuis.value;
 sauver();
}
function afficherStats(){
 const mode=periode.value,groupes={};
 const grp=c=>(groupes[c]=groupes[c]||{kg:0,eur:0,kgSuivi:0,min:0});
 const depuis=d.horaires.depuis;
 d.recharges.forEach(r=>{
  const dt=new Date(r.t);
  let cle;
  if(mode==='semaine')cle=cleSemaine(dt);
  else if(mode==='mois')cle=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
  else cle=r.saison||'Hors saison';
  const g=grp(cle);
  g.kg+=r.kg;
  g.eur+=r.kg*(r.prix||0);
  if(cleJour(dt)>=depuis)g.kgSuivi+=r.kg;
 });
 const auj=cleJour(new Date());
 for(let dt=dateDeCle(depuis),n=0;cleJour(dt)<=auj&&n<3700;dt.setDate(dt.getDate()+1),n++){
  const k=cleJour(dt),mn=minutesJour(k);
  if(!mn)continue;
  let cle;
  if(mode==='semaine')cle=cleSemaine(dt);
  else if(mode==='mois')cle=k.slice(0,7);
  else{
   const s=d.saisons.find(x=>cleJour(new Date(x.debut))<=k&&(!x.fin||k<=cleJour(new Date(x.fin))));
   cle=s?s.nom:'Hors saison';
  }
  grp(cle).min+=mn;
 }
 let html='<tr><th>Période</th><th>kg</th><th>Coût</th><th>Heures</th><th>kg/h</th></tr>';
 Object.keys(groupes).sort().reverse().forEach(c=>{
  const g=groupes[c],h=g.min/60;
  html+='<tr><td>'+c+'</td><td>'+g.kg.toFixed(1)+'</td><td>'+g.eur.toFixed(2)+' €</td><td>'+(h?h.toFixed(1):'')+'</td><td>'+(h>0&&g.kgSuivi>0?(g.kgSuivi/h).toFixed(2):'')+'</td></tr>';
 });
 stats.innerHTML=html;
 prixMoyenEl.textContent='Prix moyen pondéré : '+prixMoyen().toFixed(3)+' €/kg';
}
const prixMoyenEl=document.getElementById('prixMoyen');
function afficher(){
 const s=saisonActive();
 saisonNom.textContent=s?s.nom:'aucune';
 const kgAchetes=d.achats.reduce((a,x)=>a+x.nb*x.poids,0);
 const kgUtilises=d.recharges.reduce((a,x)=>a+x.kg,0);
 const kgStock=Math.max(0,kgAchetes-kgUtilises);
 const nbSacs=d.achats.reduce((a,x)=>a+x.nb,0);
 const poidsSac=nbSacs?kgAchetes/nbSacs:15;
 stockSacs.textContent=(kgStock/poidsSac).toFixed(1);
 stockKg.textContent=kgStock.toFixed(1)+' kg restants';
 let ha='<tr><th>Date</th><th>Sacs</th><th>Prix</th><th></th></tr>';
 d.achats.forEach((a,i)=>{
  ha+='<tr><td>'+new Date(a.t).toLocaleDateString('fr-FR')+'</td><td>'+a.nb+' x '+a.poids+' kg</td><td>'+a.prix.toFixed(2)+' €</td><td><button class="sup" onclick="supprimerAchat('+i+')">Suppr.</button></td></tr>';
 });
 histoAchats.innerHTML=ha;
 let h='<tr><th>Date</th><th>kg</th><th>Cons.</th><th>Ext.</th><th></th></tr>';
 const debut=Math.max(0,d.recharges.length-10);
 for(let i=d.recharges.length-1;i>=debut;i--){
  const r=d.recharges[i];
  const dt=new Date(r.t);
  h+='<tr><td>'+dt.toLocaleDateString('fr-FR')+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</td><td>'+r.kg+'</td><td>'+(r.consigne??'')+'</td><td>'+(r.ext!=null?r.ext+'°':'')+'</td><td><button class="sup" onclick="supprimerRecharge('+i+')">Suppr.</button></td></tr>';
 }
 histo.innerHTML=h;
 afficherHoraires();
 afficherStats();
 afficherCourbe();
 majAnnuler();
}
function chargerMeteo(lat,lon){
 fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m')
 .then(r=>r.json()).then(j=>{
  temperatureExt=j.current.temperature_2m;
  meteo.textContent='Température extérieure : '+temperatureExt+' °C';
 }).catch(()=>{meteo.textContent='Météo indisponible';});
}
function initMeteo(){
 const secours=[48.85,2.35];
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
   p=>chargerMeteo(p.coords.latitude,p.coords.longitude),
   ()=>chargerMeteo(secours[0],secours[1]),
   {timeout:8000}
  );
 }else chargerMeteo(secours[0],secours[1]);
}
function exporter(){
 const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='granules-sauvegarde.json';
 a.click();
}
function importer(e){
 const f=e.target.files[0];
 if(!f)return;
 const lecteur=new FileReader();
 lecteur.onload=()=>{
  try{d=JSON.parse(lecteur.result);normaliser();sauver();alert('Import réussi.');}
  catch(x){alert('Fichier invalide.');}
 };
 lecteur.readAsText(f);
}

/* ---- Température du salon (CSV Tempro) ---- */
const RE_LIGNE=/^\s*"?(\d{1,2})\/(\d{1,2})\/(\d{4})"?\s*[,;]\s*"?(\d{1,2}):(\d{2})(?::\d{2})?"?\s*[,;]\s*"?(-?\d+(?:[.,]\d+)?)"?\s*(?:[,;]\s*"?(\d+(?:[.,]\d+)?)"?)?\s*$/;
function importerTempro(e){
 const f=e.target.files[0];
 if(!f)return;
 const lecteur=new FileReader();
 lecteur.onload=()=>{
  let txt=String(lecteur.result).replace(/^﻿/,'');
  const lignes=txt.split(/\r\n|\r|\n/);
  let ajoutees=0,maj=0,ignorees=0,min=null,max=null;
  lignes.forEach(l=>{
   if(!l.trim())return;
   const m=RE_LIGNE.exec(l);
   if(!m){ignorees++;return;}
   const cle=m[3]+'-'+p2(m[2])+'-'+p2(m[1])+' '+p2(m[4])+':'+m[5];
   const c=parseFloat(m[6].replace(',','.'));
   const h=m[7]!==undefined?parseFloat(m[7].replace(',','.')):null;
   if(d.salon[cle])maj++;else ajoutees++;
   d.salon[cle]=[c,h];
   if(min===null||cle<min)min=cle;
   if(max===null||cle>max)max=cle;
  });
  e.target.value='';
  if(min===null){alert('Aucune mesure reconnue dans ce fichier.');return;}
  sauver();
  jour.value=max.slice(0,10);
  afficherCourbe();
  infoTempro.textContent=ajoutees+' mesures ajoutées, '+maj+' déjà connues ('+min.slice(0,10)+' → '+max.slice(0,10)+')'+(ignorees>2?' ; '+(ignorees-2)+' lignes ignorées':'');
 };
 lecteur.readAsText(f);
}
function joursDispo(){
 const set={};
 Object.keys(d.salon).forEach(k=>{set[k.slice(0,10)]=1;});
 return Object.keys(set).sort();
}
function changerJour(delta){
 const j=joursDispo();
 if(!j.length)return;
 let i=j.indexOf(jour.value);
 if(i<0){i=delta>0?-1:j.length;}
 i=Math.min(j.length-1,Math.max(0,i+delta));
 jour.value=j[i];
 afficherCourbe();
}
function afficherCourbe(){
 const j=joursDispo();
 const svg=document.getElementById('courbe');
 pointJour.textContent='';
 if(!j.length){
  svg.innerHTML='';
  moyJour.textContent='';
  detailJour.textContent='Aucune mesure : importe un CSV Tempro.';
  return;
 }
 if(!jour.value||!j.includes(jour.value))jour.value=j[j.length-1];
 const pref=jour.value+' ';
 const pts=Object.keys(d.salon).filter(k=>k.startsWith(pref)).sort().map(k=>{
  const hh=parseInt(k.slice(11,13),10),mm=parseInt(k.slice(14,16),10);
  return {x:hh+mm/60,heure:k.slice(11,16),c:d.salon[k][0],h:d.salon[k][1]};
 });
 if(!pts.length){
  svg.innerHTML='';
  moyJour.textContent='';
  detailJour.textContent='Pas de mesure ce jour-là.';
  return;
 }
 const moy=pts.reduce((a,p)=>a+p.c,0)/pts.length;
 const temps=pts.map(p=>p.c);
 const mn=Math.min(...temps),mx=Math.max(...temps);
 const hums=pts.filter(p=>p.h!=null).map(p=>p.h);
 moyJour.textContent='Moyenne : '+moy.toFixed(1)+' °C';
 detailJour.textContent='Min '+mn.toFixed(1)+' °C · Max '+mx.toFixed(1)+' °C · '+pts.length+' mesures'+(hums.length?' · humidité moy. '+(hums.reduce((a,b)=>a+b,0)/hums.length).toFixed(0)+' %':'');
 const cleLocale=dt=>dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate());
 const recs=d.recharges.map(r=>({dt:new Date(r.t),r:r})).filter(o=>!isNaN(o.dt)).sort((a,b)=>a.dt-b.dt);
 const duJour=recs.filter(o=>cleLocale(o.dt)===jour.value).map(o=>({x:o.dt.getHours()+o.dt.getMinutes()/60,heure:p2(o.dt.getHours())+':'+p2(o.dt.getMinutes()),kg:o.r.kg,consigne:o.r.consigne}));
 // consigne en vigueur : celle du dernier rechargement avant chaque instant (reprise de la veille si besoin)
 const avant=recs.filter(o=>cleLocale(o.dt)<jour.value&&o.r.consigne!=null).pop();
 const paliers=[];
 if(avant)paliers.push({x:0,c:avant.r.consigne});
 duJour.forEach(o=>{if(o.consigne!=null)paliers.push({x:o.x,c:o.consigne});});
 const consignes=paliers.map(q=>q.c);
 const L=34,R=8,T=10,B=22,W=340,H=200;
 const yMin=Math.floor(Math.min(mn,moy,...consignes)-0.5),yMax=Math.ceil(Math.max(mx,moy,...consignes)+0.5);
 const px=x=>L+(x/24)*(W-L-R);
 const py=y=>T+(1-(y-yMin)/(yMax-yMin))*(H-T-B);
 const pas=(yMax-yMin)>8?2:1;
 let g='';
 for(let y=yMin;y<=yMax;y+=pas){
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+py(y)+'" y2="'+py(y)+'" stroke="#e5e0d8"/><text x="'+(L-4)+'" y="'+(py(y)+3)+'" text-anchor="end">'+y+'°</text>';
 }
 for(let h=0;h<=24;h+=6){
  g+='<line x1="'+px(h)+'" x2="'+px(h)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#eee"/><text x="'+px(h)+'" y="'+(H-6)+'" text-anchor="middle">'+h+'h</text>';
 }
 const marche=plagesDuJour(jour.value)||[];
 marche.forEach(q=>{g+='<rect x="'+px(q[0]/60).toFixed(1)+'" y="'+T+'" width="'+(px(q[1]/60)-px(q[0]/60)).toFixed(1)+'" height="'+(H-T-B)+'" fill="#c4561a" opacity="0.10"/>';});
 g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+py(moy)+'" y2="'+py(moy)+'" stroke="#2a7" stroke-width="1.5" stroke-dasharray="5 4"/>';
 g+='<text x="'+(W-R)+'" y="'+(py(moy)-3)+'" text-anchor="end" style="fill:#2a7">moy. '+moy.toFixed(1)+'°</text>';
 if(paliers.length){
  let dpath='M'+px(paliers[0].x).toFixed(1)+','+py(paliers[0].c).toFixed(1);
  for(let i=1;i<paliers.length;i++)dpath+=' H'+px(paliers[i].x).toFixed(1)+' V'+py(paliers[i].c).toFixed(1);
  dpath+=' H'+px(24).toFixed(1);
  g+='<path d="'+dpath+'" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="2 3"/>';
  g+='<text x="'+(L+3)+'" y="'+(py(paliers[0].c)-3)+'" style="fill:#666">consigne '+paliers[0].c+'°</text>';
 }
 duJour.forEach(o=>{
  g+='<line x1="'+px(o.x).toFixed(1)+'" x2="'+px(o.x).toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#1a6fc4" stroke-width="1.5"/>';
  g+='<text x="'+px(o.x).toFixed(1)+'" y="'+(T+8)+'" text-anchor="'+(o.x>20?'end':'start')+'" style="fill:#1a6fc4">🔥'+String(o.kg).replace('.',',')+'</text>';
 });
 g+='<polyline fill="none" stroke="#c4561a" stroke-width="2" stroke-linejoin="round" points="'+pts.map(p=>px(p.x).toFixed(1)+','+py(p.c).toFixed(1)).join(' ')+'"/>';
 pts.forEach(p=>{g+='<circle cx="'+px(p.x).toFixed(1)+'" cy="'+py(p.c).toFixed(1)+'" r="2.5" fill="#c4561a"/>';});
 g+='<circle id="curseur" r="5" fill="none" stroke="#222" stroke-width="1.5" style="display:none"/>';
 svg.innerHTML=g;
 const nbRec=duJour.length,kgJour=duJour.reduce((a,o)=>a+o.kg,0);
 if(marche.length){const mn=marche.reduce((a,x)=>a+(x[1]-x[0]),0);detailJour.textContent+=' · poêle en marche '+fmtPlages(marche)+' ('+(mn/60).toFixed(1).replace('.',',')+' h)';}
 if(nbRec)detailJour.textContent+=' · '+nbRec+' rechargement'+(nbRec>1?'s':'')+' ('+kgJour.toFixed(2).replace('.',',')+' kg)';
 const choisir=ev=>{
  const r=svg.getBoundingClientRect();
  const x=((ev.clientX-r.left)/r.width)*W;
  const c=svg.querySelector('#curseur');
  let proche=null,rd=1e9;
  duJour.forEach(o=>{const dd=Math.abs(px(o.x)-x);if(dd<rd){rd=dd;proche=o;}});
  if(proche&&rd<14){
   c.style.display='none';
   pointJour.textContent='🔥 '+proche.heure+' : rechargement de '+String(proche.kg).replace('.',',')+' kg'+(proche.consigne!=null?' · consigne '+proche.consigne+' °C':'');
   return;
  }
  let best=pts[0],bd=1e9;
  pts.forEach(p=>{const dd=Math.abs(px(p.x)-x);if(dd<bd){bd=dd;best=p;}});
  c.setAttribute('cx',px(best.x));c.setAttribute('cy',py(best.c));c.style.display='';
  pointJour.textContent=best.heure+' : '+best.c.toFixed(1)+' °C'+(best.h!=null?' · '+best.h+' % d\'humidité':'');
 };
 svg.onpointerdown=choisir;
 svg.onpointermove=ev=>{if(ev.buttons||ev.pointerType==='touch')choisir(ev);};
}
majTotalRec();
afficher();
initMeteo();
</script>
